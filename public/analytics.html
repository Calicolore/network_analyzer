<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Analyzer - Analytics & Filtri Database</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/analytics.css">
</head>
<body>

    <div class="header-bar">
        <h1>📊 Analytics & Filtri Connessioni</h1>
        <a href="index.html" class="btn-back">🗺️ Torna alla Mappa</a>
    </div>

    <!-- SEZIONE FILTRI DINAMICI -->
    <div class="filter-section">
        <h3>🔍 Selezione Filtri</h3>
        <p style="color: #94a3b8; font-size: 0.9em; margin-bottom: 10px;">
            Seleziona i parametri presenti nel Database. Puoi attivare un solo valore per ciascuna categoria.
        </p>

        <div class="filter-controls">
            <div class="filter-group">
                <label for="select-country">Nazione</label>
                <select id="select-country">
                    <option value="">Tutte le Nazioni</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="select-service">Servizio / Porta</label>
                <select id="select-service">
                    <option value="">Tutti i Servizi</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="select-provider">Provider / ISP</label>
                <select id="select-provider">
                    <option value="">Tutti i Provider</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="select-status">Stato Sessione</label>
                <select id="select-status">
                    <option value="">Tutti gli Stati</option>
                </select>
            </div>
        </div>

        <!-- LISTA FILTRI ATTIVI (CHIPS) -->
        <div class="active-filters-container" id="active-filters-box">
            <span style="font-size: 0.85em; color: #94a3b8;">Filtri attivi:</span>
            <em id="no-filters-text" style="color: #64748b; font-size: 0.85em;">Nessuno</em>
        </div>
    </div>

    <!-- TABELLA RISULTATI -->
    <div class="results-container">
        <table>
            <thead>
                <tr>
                    <th>IP Remoto</th>
                    <th>Hostname</th>
                    <th>Nazione</th>
                    <th>Servizio</th>
                    <th>Provider</th>
                    <th>Byte Totali</th>
                    <th>Stato</th>
                    <th>Ultima attività</th>
                </tr>
            </thead>
            <tbody id="connections-table-body">
                <tr>
                    <td colspan="8" style="text-align: center; color: #94a3b8;">Caricamento dati...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="scripts/analytics.js"></script>
</body>
</html>
