<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Analyzer - Mappa Globale</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <!-- HEADER / BARRA SUPERIORE -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #0f172a; color: white;">
        <h1 style="margin: 0; font-size: 1.5em;">Network Analyzer - Real Time Map</h1>
        
        <div style="display: flex; gap: 10px; align-items: center;">
            <!-- NUOVO BOTTONE / LINK VERSO ANALYTICS -->
            <a href="analytics.html" style="background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9em; display: inline-flex; align-items: center; gap: 6px;">
                📊 Analytics & Filtri
            </a>

            <button id="open-settings-btn" style="background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">
                ⚙️ Impostazioni
            </button>
        </div>
    </header>
    
    <!-- CONTENITORE MAPPA RIDIMENSIONABILE -->
    <div id="map-container">
        <div id="map"></div>
        <div id="map-resize-handle" class="resize-handle"></div>
    </div>

    <!-- INTESTAZIONE SEZIONE GRAFICO BANDWIDTH -->
    <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 15px;">
        <h2 style="margin: 0;">📊 Consumo di Banda</h2>
        
        <!-- Toggle Tipo Grafico -->
        <div class="chart-view-selector" style="display: flex; gap: 5px;">
            <button id="btn-chart-line" class="btn-chart-type active">📈 Temporale</button>
            <button id="btn-chart-bar" class="btn-chart-type">📊 Per Connessione</button>
        </div>

        <span id="bandwidth-stats-text" class="stats-text" style="color: #94a3b8; font-size: 0.9em; font-weight: bold;">
            Download: 0.0 KB/s | Upload: 0.0 KB/s
        </span>
    </div>
    <button id="toggle-bandwidth-btn" class="accordion-btn" title="Nascondi/Mostra Grafico">
        <span class="btn-text">Nascondi</span>
        <span class="btn-icon">▲</span>
    </button>
</div>

    <!-- GRAFICO DEL TRAFFICO GLOBALE -->
    <div id="bandwidth-container" class="chart-container-box">
        <!-- Altezza aumentata a 280px per evitare l'effetto "basso e tozzo" -->
        <div class="chart-wrapper" style="height: 280px; position: relative; width: 100%;">
            <canvas id="bandwidthChart"></canvas>
        </div>
    </div>

    <!-- INTESTAZIONE SEZIONE COMUNICAZIONI ATTIVE -->
    <div class="section-header">
        <h2>Comunicazioni Attive</h2>
        <button id="toggle-dashboard-btn" class="accordion-btn" title="Nascondi/Mostra Connessioni">
            <span class="btn-text">Nascondi</span>
            <span class="btn-icon">▲</span>
        </button>
    </div>

    <!-- BARRA DI RICERCA E FILTRI DINAMICI -->
    <div class="search-filter-bar">
        <div class="search-box">
            <input 
                type="text" 
                id="domainSearchInput" 
                placeholder="🔍 Cerca dominio (es. youtube, google, x)..."
                autocomplete="off"
            />
        </div>

        <div class="filter-dropdowns">
            <select id="countrySelect">
                <option value="">Tutte le Nazioni</option>
            </select>

            <select id="serviceSelect">
                <option value="">Tutti i Servizi/Porte</option>
            </select>

            <button id="resetFiltersBtn" class="btn-reset">Reset Filtri</button>
        </div>
    </div>

    <!-- CONTENITORE DASHBOARD -->
    <div id="dashboard"></div>

    <!-- OVERLAY SFONDO SCURO SIDEBAR -->
    <div id="sidebar-overlay" class="overlay"></div>

    <!-- SIDEBAR IMPOSTAZIONI -->
    <aside id="settings-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Impostazioni</h3>
            <button id="close-settings-btn" class="close-btn">&times;</button>
        </div>
        <div class="sidebar-content">
            <div class="setting-item">
                <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
                    <span>Pulizia automatica sessioni</span>
                    <input type="checkbox" id="auto-clean-toggle">
                </label>
            </div>
            
            <div id="timeout-container" class="setting-item" style="display: none; margin-top: 15px;">
                <label for="cleanup-timeout" style="display: block; margin-bottom: 5px; font-size: 0.9em; color: #94a3b8;">
                    Timeout inattività (secondi):
                </label>
                <input type="number" id="cleanup-timeout" value="30" min="5" max="300" style="width: 100%; padding: 6px; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 4px;">
            </div>
        </div>
    </aside>

    <!-- DIPENDENZE ESTERNE -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <!-- MODULI APPLICATIVI CLIENT -->
    <script src="scripts/mapManager.js"></script>
    <script src="scripts/filterManager.js"></script>
    <script src="scripts/bandwidthChart.js"></script>
    <script src="scripts/uiManager.js"></script>
    <script src="scripts/settings.js"></script>
    <script src="scripts/dashboard.js"></script>
</body>
</html>
